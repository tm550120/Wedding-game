<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>結婚式二次会 クイズ＆以心伝心ゲーム 回答</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="stars">✦ ✦ ✦</div>

  <!-- 名前入力 -->
  <section id="screen-name" class="card">
    <h1>クイズ大会</h1>
    <p class="sub">はじめに お名前を入れてください</p>
    <input type="text" id="guest-name" placeholder="お名前" autocomplete="off">
    <button class="primary" id="btn-start" disabled>つぎへ</button>
    <p class="note">クイズ（全10問）と、以心伝心ゲームの予想に<br>答えられます。</p>
  </section>

  <!-- メニュー（ボタンとフォームへのリンクは js/config.js の SECTIONS から生成） -->
  <section id="screen-menu" class="card hidden">
    <h1>どちらに答えますか</h1>
    <p class="who" id="menu-who"></p>
    <div class="choices" id="menu-choices"></div>
    <p class="note">スライドで問題が出たら、同じ問題に答えてください。<br>予想は、新郎新婦の答えが5問中何問そろうかの予想です。</p>
    <p class="fallback">うまく開けない方はこちらから<br>
      <span id="fallback-links"></span>
    </p>
  </section>

  <!-- 質問（クイズ・予想で共用）。1問ごとに「選ぶ → 送信する」で送る -->
  <section id="screen-question" class="card hidden">
    <p class="progress" id="question-progress"></p>
    <div class="qnav hidden" id="question-nav"></div>
    <p class="qtext" id="question-prompt"></p>
    <div class="choices" id="question-choices"></div>
    <p class="error hidden" id="submit-error" role="alert">送信できませんでした。<br>電波を確認して、もう一度お試しください。<br>
      <a id="submit-error-link" target="_blank" rel="noopener">うまくいかない場合はこちらのフォームから</a>
    </p>
    <button class="primary" id="btn-submit" disabled>送信する</button>
    <button class="primary hidden" id="btn-next">つぎの問題へ</button>
    <button class="ghost" id="btn-question-back">← もどる</button>
  </section>

  <!-- 完了 -->
  <section id="screen-done" class="card hidden">
    <div class="done-mark">✦</div>
    <h1>ありがとうございました</h1>
    <p class="note" id="done-note">回答を受け付けました。</p>
    <button class="primary" id="btn-to-menu">メニューへもどる</button>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
