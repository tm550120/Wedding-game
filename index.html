<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>結婚式二次会 クイズ＆以心伝心ゲーム 回答</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="stars">✦ ✦ ✦</div>

  <!-- 名前入力 -->
  <section id="screen-name" class="card">
    <h1>クイズ大会</h1>
    <p class="sub">はじめに お名前を入れてください</p>
    <input type="text" id="guest-name" placeholder="お名前" autocomplete="off">
    <button class="primary" id="btn-start" disabled>つぎへ</button>
    <p class="note">クイズ（全10問）と、以心伝心ゲームの予想に<br>答えられます。<br>問題が出ると、この画面に回答ボタンが出ます。</p>
  </section>

  <!--
    回答（クイズ・予想で共用）。司会画面がいま受け付けている問題だけを js/app.js が自動で出す。
    受付中でなければ「お待ちください」「締め切りました」を出す。ゲストが問題を選ぶことはできない。
  -->
  <section id="screen-live" class="card hidden" aria-live="polite">
    <p class="who" id="live-who"></p>
    <p class="progress" id="live-kicker"></p>
    <p class="qtext" id="live-prompt"></p>
    <p class="countdown hidden" id="live-countdown"></p>
    <div class="choices" id="live-choices"></div>
    <p class="note live-note" id="live-note"></p>
    <p class="error hidden" id="submit-error" role="alert">送信できませんでした。<br>電波を確認して、もう一度お試しください。<br>
      <a id="submit-error-link" target="_blank" rel="noopener">うまくいかない場合はこちらのフォームから</a>
    </p>
    <button class="primary hidden" id="btn-submit" disabled>送信する</button>
    <p class="notice hidden" id="live-notice" role="status">通信が不安定です。自動でつなぎ直しています…</p>
  </section>

  <p class="fallback hidden" id="fallback">うまく動かない方はこちらから<br>
    <span id="fallback-links"></span>
  </p>
  <p class="demo-badge hidden" id="badge-demo">デモ表示（回答は送信されません）</p>

  <script type="module" src="js/app.js"></script>
</body>
</html>
