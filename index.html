<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>以心伝心ゲーム 回答</title>
<style>
  :root{
    --green:#123528;
    --green-dark:#0b241b;
    --gold:#c9a227;
    --gold-light:#e8cf7a;
    --paper:#f7f3e8;
    --ink:#22302a;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:"Hiragino Mincho ProN","Yu Mincho","Hiragino Sans",sans-serif;
    background:radial-gradient(120% 100% at 50% 0%, #1a4634 0%, var(--green) 45%, var(--green-dark) 100%);
    color:var(--paper);
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:24px 16px 40px;
  }
  .stars{ color:var(--gold); letter-spacing:.6em; text-align:center; font-size:14px; opacity:.85; margin-bottom:10px; }
  .card{
    width:100%; max-width:520px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(201,162,39,.55);
    border-radius:14px;
    padding:26px 20px 30px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  h1{
    font-size:26px; text-align:center; margin:4px 0 6px; letter-spacing:.14em; font-weight:600;
  }
  .sub{ text-align:center; font-size:14px; color:var(--gold-light); margin:0 0 22px; letter-spacing:.08em; }
  .progress{ text-align:center; font-size:13px; color:var(--gold-light); letter-spacing:.2em; margin-bottom:14px; }
  .qtext{ font-size:20px; line-height:1.6; text-align:center; margin:6px 0 22px; font-weight:600; }
  .choices{ display:flex; flex-direction:column; gap:12px; }
  button.choice{
    appearance:none; border:1px solid var(--gold); cursor:pointer;
    background:var(--paper); color:var(--ink);
    font-family:inherit; font-size:19px; font-weight:600; letter-spacing:.05em;
    padding:18px 14px; border-radius:10px; width:100%;
    transition:transform .06s ease, background .15s ease;
  }
  button.choice:active{ transform:scale(.98); background:var(--gold-light); }
  button.choice.selected{ background:var(--gold); color:#fff; }
  .primary{
    appearance:none; border:none; cursor:pointer; width:100%;
    background:var(--gold); color:#fff;
    font-family:inherit; font-size:19px; font-weight:700; letter-spacing:.1em;
    padding:17px 14px; border-radius:10px; margin-top:20px;
  }
  .primary:disabled{ opacity:.45; cursor:default; }
  .ghost{
    appearance:none; background:none; border:none; cursor:pointer;
    color:var(--gold-light); font-family:inherit; font-size:15px;
    padding:12px; margin-top:8px; width:100%; letter-spacing:.08em;
  }
  input[type="text"]{
    width:100%; font-family:inherit; font-size:19px; padding:16px 14px;
    border-radius:10px; border:1px solid var(--gold); background:var(--paper); color:var(--ink);
    outline:none;
  }
  .note{ font-size:13px; line-height:1.7; color:#d9d2ba; text-align:center; margin-top:18px; }
  .fallback{ margin-top:26px; text-align:center; font-size:13px; }
  .fallback a{ color:var(--gold-light); }
  .done-mark{ font-size:52px; text-align:center; color:var(--gold); margin:10px 0 4px; }
  .hidden{ display:none !important; }
  .summary{ font-size:15px; line-height:2; margin:0 0 6px; }
  .summary b{ color:var(--gold-light); font-weight:600; }
</style>
</head>
<body>
  <div class="stars">✦ ✦ ✦</div>

  <!-- 名前入力 -->
  <section id="screen-name" class="card">
    <h1>以心伝心ゲーム</h1>
    <p class="sub">新郎新婦の答えと そろえてください</p>
    <input type="text" id="guest-name" placeholder="お名前" autocomplete="off">
    <button class="primary" id="btn-start" disabled>はじめる</button>
    <p class="note">全5問です。スライドで問題が出たら、<br>同じ問題に答えてください。</p>
    <p class="fallback">うまく開けない方は <a href="https://forms.gle/yRXusxC91QuDZiWc6" target="_blank" rel="noopener">こちらのフォーム</a> からどうぞ</p>
  </section>

  <!-- 質問 -->
  <section id="screen-q" class="card hidden">
    <p class="progress" id="q-progress">Q1 / 5</p>
    <p class="qtext" id="q-text"></p>
    <div class="choices" id="q-choices"></div>
    <button class="ghost" id="btn-back">← もどる</button>
  </section>

  <!-- 確認・送信 -->
  <section id="screen-confirm" class="card hidden">
    <p class="progress">かくにん</p>
    <p class="summary" id="confirm-summary"></p>
    <button class="primary" id="btn-submit">送信する</button>
    <button class="ghost" id="btn-fix">← なおす</button>
  </section>

  <!-- 完了 -->
  <section id="screen-done" class="card hidden">
    <div class="done-mark">✦</div>
    <h1>ありがとうございました</h1>
    <p class="note">回答を受け付けました。<br>結果発表をお楽しみに！</p>
  </section>

  <!-- Googleフォーム送信用（非表示） -->
  <form id="gform" method="POST" target="gform-target" class="hidden"></form>
  <iframe name="gform-target" id="gform-target" class="hidden"></iframe>

<script>
"use strict";

/* ===== Googleフォーム連携設定 =====
   entry ID は事前入力URLから取得して差し替える（メインchatの取得結果待ち） */
const FORM_ACTION = "https://docs.google.com/forms/d/e/1FAIpQLScVs2wf3GT4z0r__saPNSZKgQwgJdULPya85YlXWvRMfSsWAA/formResponse";
const ENTRY = {
  name: "entry.178235110",  // お名前
  q1:   "entry.2004179028", // Q1 初デートの場所
  q2:   "entry.1795097920", // Q2 新婦の手料理
  q3:   "entry.1039771443", // Q3 付き合うきっかけ
  q4:   "entry.1732628946", // Q4 ハネムーン
  q5:   "entry.1720191206"  // Q5 新婦の好きなところ
};

/* ===== 問題（お題を差し替える時はフォーム側も同時に直す） ===== */
const QUESTIONS = [
  { key:"q1", text:"新郎新婦の初デートの場所は？",            choices:["水族館","映画館","カフェ","遊園地"] },
  { key:"q2", text:"新婦の手料理で新郎が一番好きなのは？",    choices:["カレー","肉じゃが","オムライス","パスタ"] },
  { key:"q3", text:"二人が付き合うきっかけになったのは？",    choices:["友人の紹介","職場","学校","アプリ"] },
  { key:"q4", text:"ハネムーンで行きたい場所は？",            choices:["ハワイ","沖縄","ヨーロッパ","北海道"] },
  { key:"q5", text:"新郎が新婦の好きなところを一言で言うと？", choices:["笑顔","優しさ","料理上手","明るさ"] }
];

const answers = { name:"", q1:"", q2:"", q3:"", q4:"", q5:"" };
let current = 0; // 0..4 = 質問番号

const $ = (id) => document.getElementById(id);
const screens = ["screen-name","screen-q","screen-confirm","screen-done"];
function show(id){
  screens.forEach(s => $(s).classList.toggle("hidden", s !== id));
  window.scrollTo(0,0);
}

/* 名前入力 */
$("guest-name").addEventListener("input", (e) => {
  answers.name = e.target.value.trim();
  $("btn-start").disabled = answers.name.length === 0;
});
$("btn-start").addEventListener("click", () => { current = 0; renderQuestion(); });

/* 質問画面 */
function renderQuestion(){
  const q = QUESTIONS[current];
  $("q-progress").textContent = "Q" + (current + 1) + " / 5";
  $("q-text").textContent = q.text;
  const box = $("q-choices");
  box.innerHTML = "";
  q.choices.forEach(choice => {
    const b = document.createElement("button");
    b.className = "choice" + (answers[q.key] === choice ? " selected" : "");
    b.textContent = choice;
    b.addEventListener("click", () => {
      answers[q.key] = choice;
      if (current < QUESTIONS.length - 1) { current++; renderQuestion(); }
      else { renderConfirm(); }
    });
    box.appendChild(b);
  });
  show("screen-q");
}
$("btn-back").addEventListener("click", () => {
  if (current === 0) { show("screen-name"); }
  else { current--; renderQuestion(); }
});

/* 確認画面 */
function renderConfirm(){
  const lines = QUESTIONS.map((q,i) =>
    "<b>Q" + (i+1) + "</b> " + escapeHtml(answers[q.key])
  ).join("<br>");
  $("confirm-summary").innerHTML =
    "<b>お名前</b> " + escapeHtml(answers.name) + "<br>" + lines;
  show("screen-confirm");
}
$("btn-fix").addEventListener("click", () => { current = 0; renderQuestion(); });

/* 送信（隠しiframeへPOST。Google側の応答ページが読み込まれたら完了画面へ） */
let submitted = false;
$("btn-submit").addEventListener("click", () => {
  const form = $("gform");
  form.action = FORM_ACTION;
  form.innerHTML = "";
  const fields = [
    [ENTRY.name, answers.name],
    [ENTRY.q1, answers.q1], [ENTRY.q2, answers.q2], [ENTRY.q3, answers.q3],
    [ENTRY.q4, answers.q4], [ENTRY.q5, answers.q5],
    /* 複数ページのフォームでは全ページを通過した扱いにしないと
       2ページ目以降の回答が保存されないため必須 */
    ["pageHistory", "0,1,2,3,4,5"],
    ["fvv", "1"]
  ];
  fields.forEach(([name, value]) => {
    const input = document.createElement("input");
    input.type = "hidden"; input.name = name; input.value = value;
    form.appendChild(input);
  });
  submitted = true;
  form.submit();
  /* 応答が返らない環境向けの保険：4秒後にも完了画面を出す */
  setTimeout(() => { if (submitted) show("screen-done"); }, 4000);
});
$("gform-target").addEventListener("load", () => {
  if (submitted) show("screen-done");
});

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
</script>
</body>
</html>
