<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>司会画面｜クイズ＆以心伝心ゲーム</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/host.css">
</head>
<body class="host">
  <!-- スライド: 画像を全面に映す（<img> は js/host.js が入れる） -->
  <div class="stage" id="stage">
    <p class="stage-message hidden" id="stage-message">スライドを読み込み中…</p>
  </div>

  <!-- 問題のスライドに重ねる、受付の状態と回答した人数（合計だけ） -->
  <div class="gate hidden" id="gate" data-view="ready">
    <div class="gate-state">
      <p class="gate-status"><span class="gate-dot"></span><span id="gate-status"></span></p>
      <!-- 自動で締め切るまでの残り時間（この画面で受付を開けたときだけ出る） -->
      <p class="gate-timer hidden" id="gate-timer">
        <span class="gate-timer-label">残り</span>
        <span class="gate-time" id="gate-time">0:00</span>
      </p>
    </div>
    <p class="gate-count" id="gate-count">
      <span class="gate-label">回答</span>
      <span class="gate-num" id="gate-total">0</span>
      <span class="gate-unit">人</span>
    </p>
  </div>

  <!-- 正解の発表（スライドの上に重ねる） -->
  <div class="reveal hidden" id="reveal">
    <div class="reveal-card">
      <p class="reveal-kicker" id="reveal-kicker"></p>
      <p class="reveal-label" id="reveal-label">正解は</p>
      <p class="reveal-answer" id="reveal-answer"></p>
    </div>
  </div>

  <!-- 「予想結果」のスライド: 司会者にだけ見せる小さな案内（数を入れる前だけ出る） -->
  <p class="pred-prompt hidden" id="pred-prompt">一致数を入力（0〜5キー）</p>

  <!-- 「予想結果」のスライド: 予想が的中した人の名前（スライドの上に重ねる） -->
  <div class="pred-names hidden" id="pred-names">
    <p class="pred-names-kicker" id="pred-names-kicker"></p>
    <p class="pred-names-title">
      <span class="pred-names-label">予想的中</span>
      <span class="pred-names-num" id="pred-names-count">0</span>
      <span class="pred-names-unit">人</span>
    </p>
    <ul class="pred-names-grid" id="pred-names-grid"></ul>
    <p class="pred-names-message hidden" id="pred-names-message"></p>
    <!-- 締めのひとこと（的中した人がいるときだけ。文は js/config.js の HOST.predResultClosing） -->
    <p class="pred-names-closing hidden" id="pred-names-closing"></p>
  </div>

  <!-- Apps Script の URL が未設定のときの案内 -->
  <section class="card host-setup hidden" id="setup">
    <h2>Apps Script の URL が未設定です</h2>
    <p><code>js/config.js</code> の <code>HOST.statsUrl</code> に、Apps Script ウェブアプリの URL（…/exec）を設定してください。<br>
      手順は README.md の「司会画面」にあります。</p>
    <p>画面の流れだけ確認するには <a href="?demo=1">host.html?demo=1</a> を開いてください（仮のスライドとダミーの数字で動きます）。</p>
  </section>

  <!-- 司会者向けの小さな表示: うまくいっていないときだけ出る知らせ（通信エラー・設定の不足など） -->
  <footer class="host-foot">
    <span class="badge badge-error hidden" id="badge-error" role="status"></span>
  </footer>

  <script type="module" src="js/host.js"></script>
</body>
</html>
